<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Whiplash</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/vendor/xterm.css" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="app" class="app">
      <div class="shell">
        <div class="work">
          <aside id="left" class="sidebar-left">
            <div class="titlebar-left">
              <span class="traffic-pad"></span>
              <a class="app-name" href="#/"><svg class="mark" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="28" cy="32" r="7.5" stroke-width="4.5"/>  <path d="M36 22.5 V36" stroke-width="5.5"/>  <path d="M36 36 C36 41 42 42 45 38 C50 31 48 19 39 14 C29 8.5 14 12 10 24 C6 36 13 49 26 51 C33 52 39 50 44 46" stroke-width="4.5"/>  <path d="M44 46 C48 43 51 39 53 34" stroke-width="3.2"/>  <path d="M53 34 C54.5 30 56.5 27 59 25" stroke-width="2"/>  <path d="M59 25 L62 23.5 M59 25 L61.5 27.5 M59 25 L60.5 21.5" stroke-width="1.4"/></svg><span>whiplash</span></a>
              <button id="toggle-left" class="sidebar-toggle" type="button"></button>
            </div>
            <div class="left-body">
              <div class="sidebar-nav">
                <button id="open-palette" class="search-button" type="button"></button>
              </div>
              <div class="section-header">
                <span id="channels-label"></span>
                <button id="new-channel" class="icon-xs" type="button"></button>
              </div>
              <div id="channels" class="channels" role="group"></div>
              <footer class="sidebar-footer">
                <button id="open-settings" class="icon-xs" type="button"></button>
                <button id="theme" class="icon-xs" type="button"></button>
              </footer>
            </div>
            <div class="resizer left" data-side="left" role="separator" aria-orientation="vertical"></div>
          </aside>
          <section class="workbench">
            <div class="drag-strip"></div>
            <div class="tabstrip">
              <div class="collapsed-spacer"></div>
              <div id="tabs" class="tabs" role="tablist"></div>
              <button id="new-tab" class="new-tab" type="button"></button>
              <span class="grow"></span>
              <button id="toggle-right-floating" class="sidebar-toggle" type="button"></button>
            </div>
            <div id="main" class="main"></div>
          </section>
        </div>
        <aside id="right" class="sidebar-right">
          <div class="resizer right" data-side="right" role="separator" aria-orientation="vertical"></div>
          <div class="activity-bar">
            <div id="activity" class="activity-strip" role="tablist"></div>
            <button id="toggle-right" class="sidebar-toggle" type="button"></button>
          </div>
          <div id="panel" class="panel"></div>
        </aside>
      </div>
      <section id="settings" class="settings" hidden></section>
      <footer class="statusbar">
        <div id="usage" class="usage-chips" aria-live="polite"></div>
        <span class="grow"></span>
      </footer>
    </div>
    <dialog id="dialog" class="dialog"></dialog>
    <dialog id="palette" class="palette"></dialog>
    <script type="module" src="/app.js"></script>
  </body>
</html>
